[package]
name = "splice"
version = "1.1.0"
edition = "2024"
description = "Splice — a native Linux timeline video editor"
license = "MIT"
rust-version = "1.88"

[[bin]]
name = "splice"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15.3"
crossbeam-channel = "0.5"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31.1"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
sha2 = "0.10"
