name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  checks: read

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag and its branch commit are pushed together, so CI may still
          # be running: wait for it instead of publishing untested code.
          for attempt in $(seq 1 60); do
            result="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
              --jq '[.check_runs[] | select(.name == "test")]
                    | if length == 0 then "missing"
                      elif all(.status == "completed") then
                        (if all(.conclusion == "success") then "success" else "failure" end)
                      else "pending" end')"
            echo "CI result for $GITHUB_SHA: $result (attempt $attempt)"
            case "$result" in
              success) exit 0 ;;
              failure) echo "CI failed for this commit; not releasing"; exit 1 ;;
            esac
            sleep 30
          done
          echo "timed out waiting for CI"; exit 1
      - name: Verify tag matches Cargo.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test "$version" = "$crate_version" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          }
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package release
        run: |
          name="splice-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/splice README.md LICENSE CHANGELOG.md "dist/$name/"
          cp -r packaging "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --title "Splice $GITHUB_REF_NAME" --generate-notes --verify-tag
